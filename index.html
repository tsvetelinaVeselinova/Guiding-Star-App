<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050816">
<title>Звездно небе от хора</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="bg"></canvas>
<div id="sky"></div>
<div id="hello">Небето е празно.<br>Натиснете „＋ Добави“ и запалете първата си звезда ✨</div>

<header>
  <h1>✦ Звездно небе от хора ✦</h1>
  <div class="bar">
    <input id="q" type="search" placeholder="Търси: правен документ, лекар, химия…" autocomplete="off">
    <button class="btn" id="add">＋ Добави</button>
  </div>
</header>
<div id="results"></div>
<div id="legend"></div>
<div id="count"><span id="n"></span>
  <button class="btn ghost" id="exp" style="padding:6px 12px;font-size:12px">⬇ Копие</button>
  <button class="btn ghost" id="imp" style="padding:6px 12px;font-size:12px">⬆ Възстанови</button>
  <input type="file" id="file" accept=".json" hidden>
</div>

<div class="modal" id="mForm"><form class="card" id="form" autocomplete="off">
  <h2 id="fTitle">Нова звезда</h2>
  <label>Име *</label><input name="name" required>
  <div class="row">
    <div><label>Област *</label><select name="cat" id="catSel"></select></div>
    <div><label>Град</label><input name="city"></div>
  </div>
  <label>С какво може да помогне? *</label>
  <textarea name="help" required placeholder="напр. съставяне на правни документи, договори, консултации"></textarea>
  <label>Ключови думи (със запетая)</label><input name="tags" placeholder="договор, нотариус, наследство">
  <div class="row">
    <div><label>Телефон</label><input name="phone" type="tel"></div>
    <div><label>Имейл</label><input name="email" type="email"></div>
  </div>
  <label>Бележки</label><textarea name="notes"></textarea>
  <div class="actions">
    <button type="button" class="btn ghost" data-close>Отказ</button>
    <button class="btn">✦ Запази</button>
  </div>
</form></div>

<div class="modal" id="mView"><div class="card info" id="view"></div></div>

<script src="app.js"></script>
</body>
</html>
