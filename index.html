<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050816">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Звездно небе">
<title>Звездно небе от хора</title>
<style>
:root{--bg:#050816;--panel:#0e1430;--line:#26305c;--text:#e9ecff;--dim:#9aa3d6;--gold:#ffd86b;--blue:#8fb4ff;--danger:#ff7b8a}
@media (prefers-color-scheme:light){:root{--bg:#050816}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:radial-gradient(ellipse at 50% 0,#14204f 0,#050816 70%) fixed}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:16px}
h1{font-size:1.3rem;margin:0;color:var(--gold);letter-spacing:.5px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 16px}
button:hover{border-color:var(--blue)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--gold);color:#1a1400;border-color:var(--gold);font-weight:600}
button.small{padding:5px 11px;font-size:.85rem}
button.danger{color:var(--danger)}
.search{padding:0 16px 8px}
.search input{width:100%}
input,textarea,select{width:100%;font:inherit;color:var(--text);background:#080d26;border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:70px;resize:vertical}
label{display:block;margin:10px 0 4px;color:var(--dim);font-size:.9rem}
.empty{text-align:center;color:var(--dim);padding:60px 24px;line-height:1.6}
#sky{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:12px 16px 40px}
.star{background:linear-gradient(160deg,#101a45,#0a1030);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:block;width:100%;color:var(--text)}
.star .ico{color:var(--gold);font-size:1.4rem;text-shadow:0 0 10px var(--gold)}
.star b{display:block;margin-top:4px}
.star small{display:block;color:var(--dim);margin-top:2px}
.badge{display:inline-block;margin-top:8px;font-size:.78rem;color:var(--blue);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);width:min(560px,94vw);max-height:92vh;padding:18px;overflow:auto}
dialog::backdrop{background:rgba(2,4,14,.75)}
dialog h2{margin:0 0 6px;color:var(--gold);font-size:1.15rem}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.info p{margin:4px 0;color:var(--dim)}
.info a{color:var(--blue)}
.sec{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.sec h3{margin:0 0 8px;font-size:1rem;color:var(--blue)}
.contact{background:#080d26;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.contact b{display:block}
.contact .meta{color:var(--dim);font-size:.88rem;margin-top:2px}
.contact .acts{display:flex;gap:6px;margin-top:8px}
.kw{color:var(--gold);font-size:.82rem}
.hint{color:var(--dim);font-size:.85rem}
@media (prefers-reduced-motion:no-preference){.star{transition:transform .15s}.star:hover{transform:translateY(-2px)}}
</style>
</head>
<body>
<header>
  <h1>✦ Звездно небе от хора ✦</h1>
  <div class="bar">
    <button class="primary" id="addBtn">＋ Добави</button>
    <button id="exportBtn">⬇ Копие</button>
    <button id="importBtn">⬆ Възстанови</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
  </div>
</header>
<div class="search"><input id="q" type="search" placeholder="Търси по име, област, град, ключова дума…" aria-label="Търсене"></div>
<main id="sky"></main>

<!-- Форма: нова/редакция на звезда или познат -->
<dialog id="formDlg">
  <form id="form" method="dialog">
    <h2 id="formTitle">Нова звезда</h2>
    <label for="f_name">Име *</label><input id="f_name" required>
    <label for="f_field">Област *</label><input id="f_field" required>
    <label for="f_city">Град</label><input id="f_city">
    <label for="f_help">С какво може да помогне? *</label><textarea id="f_help" required></textarea>
    <label for="f_kw">Ключови думи (със запетая)</label><input id="f_kw">
    <label for="f_phone">Телефон</label><input id="f_phone" type="tel">
    <label for="f_email">Имейл</label><input id="f_email" type="email">
    <label for="f_notes">Бележки</label><textarea id="f_notes"></textarea>
    <div class="row">
      <button type="button" id="cancelForm">Отказ</button>
      <button class="primary" type="submit">✦ Запази</button>
    </div>
  </form>
</dialog>

<!-- Детайли на човек + списък познати -->
<dialog id="detailDlg">
  <div id="detail"></div>
</dialog>

<script>
(function(){
"use strict";
var KEY="guidingStar.v2";
var OLD_KEYS=["guidingStar","stars","starSky","guiding-star","people"];
var people=load();
var ctx=null; // {personId, contactId|null, mode:'person'|'contact'}
var openId=null;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function kwList(s){return String(s||"").split(",").map(function(x){return x.trim()}).filter(Boolean)}

function normalize(p){
  return {
    id:p.id||uid(),
    name:p.name||"",field:p.field||"",city:p.city||"",
    help:p.help||"",keywords:Array.isArray(p.keywords)?p.keywords:kwList(p.keywords),
    phone:p.phone||"",email:p.email||"",notes:p.notes||"",
    contacts:Array.isArray(p.contacts)?p.contacts.map(normalize):[]
  };
}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){return JSON.parse(raw).map(normalize)}
    for(var i=0;i<OLD_KEYS.length;i++){
      var o=localStorage.getItem(OLD_KEYS[i]);
      if(o){var a=JSON.parse(o);if(Array.isArray(a)&&a.length&&a[0]&&a[0].name){return a.map(normalize)}}
    }
  }catch(e){}
  return [];
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(people))}catch(e){alert("Не може да се запази в браузъра.")}}

function matches(p,q){
  if(!q)return true;
  q=q.toLowerCase();
  function hit(x){return [x.name,x.field,x.city,x.help,x.notes,x.keywords.join(" ")].join(" ").toLowerCase().indexOf(q)>-1}
  return hit(p)||p.contacts.some(hit);
}

function renderSky(){
  var sky=document.getElementById("sky");
  var q=document.getElementById("q").value.trim();
  var list=people.filter(function(p){return matches(p,q)});
  if(!people.length){
    sky.innerHTML='<div class="empty">Небето е празно.<br>Натиснете „＋ Добави“ и запалете първата си звезда ✨</div>';return;
  }
  if(!list.length){sky.innerHTML='<div class="empty">Няма резултати.</div>';return}
  sky.innerHTML=list.map(function(p){
    var n=p.contacts.length;
    return '<button class="star" data-id="'+esc(p.id)+'"><span class="ico">✦</span><b>'+esc(p.name)+'</b><small>'+esc(p.field)+(p.city?" · "+esc(p.city):"")+'</small>'+
      '<span class="badge">'+(n?("познати: "+n):"+ познати")+'</span></button>';
  }).join("");
}

function contactHtml(pid,c){
  var kws=c.keywords.length?'<div class="kw">'+c.keywords.map(esc).join(", ")+'</div>':"";
  var links=[];
  if(c.phone)links.push('<a href="tel:'+esc(c.phone)+'">'+esc(c.phone)+'</a>');
  if(c.email)links.push('<a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a>');
  return '<div class="contact"><b>'+esc(c.name)+'</b>'+
    '<div class="meta">'+esc(c.field)+(c.city?" · "+esc(c.city):"")+'</div>'+
    (c.help?'<div class="meta">'+esc(c.help)+'</div>':"")+kws+
    (links.length?'<div class="meta">'+links.join(" · ")+'</div>':"")+
    (c.notes?'<div class="meta">📝 '+esc(c.notes)+'</div>':"")+
    '<div class="acts"><button class="small" data-act="editContact" data-cid="'+esc(c.id)+'">Редактирай</button>'+
    '<button class="small danger" data-act="delContact" data-cid="'+esc(c.id)+'">Изтрий</button></div></div>';
}

function renderDetail(){
  var p=people.find(function(x){return x.id===openId});
  var box=document.getElementById("detail");
  if(!p){document.getElementById("detailDlg").close();return}
  var links=[];
  if(p.phone)links.push('<a href="tel:'+esc(p.phone)+'">'+esc(p.phone)+'</a>');
  if(p.email)links.push('<a href="mailto:'+esc(p.email)+'">'+esc(p.email)+'</a>');
  box.innerHTML=
    '<h2>✦ '+esc(p.name)+'</h2><div class="info">'+
    '<p>'+esc(p.field)+(p.city?" · "+esc(p.city):"")+'</p>'+
    '<p>'+esc(p.help)+'</p>'+
    (p.keywords.length?'<p class="kw">'+p.keywords.map(esc).join(", ")+'</p>':"")+
    (links.length?'<p>'+links.join(" · ")+'</p>':"")+
    (p.notes?'<p>📝 '+esc(p.notes)+'</p>':"")+'</div>'+
    '<div class="row" style="justify-content:flex-start;margin-top:10px">'+
    '<button class="small" data-act="editPerson">Редактирай</button>'+
    '<button class="small danger" data-act="delPerson">Изтрий</button></div>'+
    '<div class="sec"><h3>Познати на '+esc(p.name)+' ('+p.contacts.length+')</h3>'+
    (p.contacts.length?p.contacts.map(function(c){return contactHtml(p.id,c)}).join(""):'<p class="hint">Още няма добавени познати. Добавете хора, които '+esc(p.name)+' познава и какво могат да помогнат.</p>')+
    '<button class="primary" data-act="addContact">＋ Добави познат</button></div>'+
    '<div class="row"><button data-act="close">Затвори</button></div>';
}

function openForm(mode,pid,cid){
  ctx={mode:mode,personId:pid||null,contactId:cid||null};
  var f=document.getElementById("form");f.reset();
  var data=null,title="Нова звезда";
  if(mode==="person"&&pid){data=people.find(function(x){return x.id===pid});title="Редакция на звезда"}
  if(mode==="contact"){
    var p=people.find(function(x){return x.id===pid});
    if(cid){data=p.contacts.find(function(x){return x.id===cid});title="Редакция на познат"}
    else title="Нов познат на "+p.name;
  }
  document.getElementById("formTitle").textContent=title;
  if(data){
    document.getElementById("f_name").value=data.name;
    document.getElementById("f_field").value=data.field;
    document.getElementById("f_city").value=data.city;
    document.getElementById("f_help").value=data.help;
    document.getElementById("f_kw").value=data.keywords.join(", ");
    document.getElementById("f_phone").value=data.phone;
    document.getElementById("f_email").value=data.email;
    document.getElementById("f_notes").value=data.notes;
  }
  document.getElementById("formDlg").showModal();
}

document.getElementById("form").addEventListener("submit",function(e){
  e.preventDefault();
  var rec={
    name:document.getElementById("f_name").value.trim(),
    field:document.getElementById("f_field").value.trim(),
    city:document.getElementById("f_city").value.trim(),
    help:document.getElementById("f_help").value.trim(),
    keywords:kwList(document.getElementById("f_kw").value),
    phone:document.getElementById("f_phone").value.trim(),
    email:document.getElementById("f_email").value.trim(),
    notes:document.getElementById("f_notes").value.trim()
  };
  if(!rec.name||!rec.field||!rec.help)return;
  if(ctx.mode==="person"){
    if(ctx.personId){
      var p=people.find(function(x){return x.id===ctx.personId});
      Object.assign(p,rec);
    }else{
      rec.id=uid();rec.contacts=[];people.push(normalize(rec));
    }
  }else{
    var parent=people.find(function(x){return x.id===ctx.personId});
    if(ctx.contactId){
      var c=parent.contacts.find(function(x){return x.id===ctx.contactId});
      Object.assign(c,rec);
    }else{
      rec.id=uid();rec.contacts=[];parent.contacts.push(normalize(rec));
    }
  }
  save();
  document.getElementById("formDlg").close();
  renderSky();
  if(openId&&document.getElementById("detailDlg").open)renderDetail();
});
document.getElementById("cancelForm").onclick=function(){document.getElementById("formDlg").close()};

document.getElementById("addBtn").onclick=function(){openForm("person")};
document.getElementById("q").addEventListener("input",renderSky);

document.getElementById("sky").addEventListener("click",function(e){
  var b=e.target.closest(".star");if(!b)return;
  openId=b.getAttribute("data-id");renderDetail();document.getElementById("detailDlg").showModal();
});

document.getElementById("detailDlg").addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var act=b.getAttribute("data-act"),cid=b.getAttribute("data-cid");
  var p=people.find(function(x){return x.id===openId});
  if(act==="close"){document.getElementById("detailDlg").close()}
  else if(act==="addContact"){openForm("contact",openId)}
  else if(act==="editContact"){openForm("contact",openId,cid)}
  else if(act==="editPerson"){openForm("person",openId)}
  else if(act==="delContact"){
    if(confirm("Да изтрия ли този познат?")){p.contacts=p.contacts.filter(function(c){return c.id!==cid});save();renderDetail();renderSky()}
  }else if(act==="delPerson"){
    if(confirm("Да изтрия ли "+p.name+" и всичките му познати?")){people=people.filter(function(x){return x.id!==openId});save();document.getElementById("detailDlg").close();renderSky()}
  }
});

// Копие / Възстановяване (приема и стария формат без познати)
document.getElementById("exportBtn").onclick=function(){
  var blob=new Blob([JSON.stringify(people,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="zvezdno-nebe-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
};
document.getElementById("importBtn").onclick=function(){document.getElementById("file").click()};
document.getElementById("file").addEventListener("change",function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var data=JSON.parse(r.result);
      if(!Array.isArray(data))data=data.stars||data.people||data.data;
      if(!Array.isArray(data))throw new Error("формат");
      if(!confirm("Да заменя ли текущите данни с "+data.length+" записа от файла?"))return;
      people=data.map(normalize);save();renderSky();
    }catch(err){alert("Файлът не може да се прочете.")}
  };
  r.readAsText(f);e.target.value="";
});

renderSky();
})();
</script>
</body>
</html>
